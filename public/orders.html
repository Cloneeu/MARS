<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Órdenes 📦</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');

          * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Lato", sans-serif;
    }
      .navbar {
        height: 90px;
        background-color: #212529 !important;
      }
.product-img {
    width: 50px;        /* Tamaño pequeño */
    height: 50px;       /* Cuadrada */
    object-fit: cover;  /* Recorta para mantener forma */
    border-radius: 8px; /* Opcional: bordes redondeados */
    margin-right: 10px; /* Separación del texto */
}
      body {
        background-color: #f4f4f4;
        font-family: serif;
      }

      .orders-container {
        max-width: 900px;
        margin: 40px auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }

      .order-card {
        border-bottom: 1px solid #ddd;
        padding: 15px;
        cursor: pointer;
      }

      /* LISTA INTERNA DEL MODAL */
      .modal-product-list {
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 10px;
      }

      .product-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #eee;
      }

      .rate-btn {
        background: #212529;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
      }

      #rating-stars .star {
  font-size: 1.8rem;
  cursor: pointer;
  color: #ccc;
}

#rating-stars .star.selected,
#rating-stars .star:hover,
#rating-stars .star:hover ~ .star {
  color: #f7cd2e; /* color de estrella amarilla */
}
    </style>
  </head>

  <body>

    <!-- NAV -->
    <nav class="navbar d-flex justify-content-center align-items-center">
      <span style="color:white; font-size:35px;">Tus Órdenes</span>
      
    </nav>

    <!-- LISTA DE ÓRDENES -->
    <div class="orders-container">
      <h3 class="text-center mb-4">Historial</h3>
      <div id="orders-list">

        <!-- ELEMENTO PLANTILLA -->
        <div class="order-card">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5>Orden #00001</h5>
              <p class="text-muted">Fecha: 2025-11-30</p>
            </div>
            <span class="fw-bold text-success">$999</span>
          </div>
        </div>

      </div>
    </div>

    <!-- MODAL DETALLE ORDEN -->
    <div class="modal fade" id="modalDetalleOrden" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">Detalle de Orden</h5>
            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <div id="detalle-info">
              <h5>Orden #00001</h5>
              <p>Fecha: 2025-11-30</p>
            </div>

            <h6 class="mt-4">Productos</h6>

            <!-- LISTA CON SCROLL -->
            <div id="detalle-productos" class="modal-product-list">

              <!-- PLANTILLA DE PRODUCTO -->
              <div class="product-item">
                <span>Reloj Deportivo</span>
                <button class="rate-btn" onclick="abrirModalResena(1)">Reseñar</button>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- MODAL RESEÑA -->
    <div class="modal fade" id="modalResena" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Reseñar Producto</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <h6 id="nombre-producto-resena">Producto X</h6>

        <!-- ⭐ Rating -->
        <div id="rating-stars" class="mb-3 d-flex gap-2">
          <i class="star bi bi-star" data-value="1"></i>
          <i class="star bi bi-star" data-value="2"></i>
          <i class="star bi bi-star" data-value="3"></i>
          <i class="star bi bi-star" data-value="4"></i>
          <i class="star bi bi-star" data-value="5"></i>
        </div>

        <textarea id="textoResena" class="form-control" rows="4" placeholder="Escribe tu reseña..."></textarea>

        <button id="btnEnviarResena" class="btn btn-success w-100 mt-3">
          Enviar Reseña
        </button>

      </div>

    </div>
  </div>
</div>

    <!-- FOOTER NAV -->
    <nav class="navbar bg-dark justify-content-center align-items-center mt-4">
      <a href="products.html">
        <i class="fas fa-home" style="color: white; font-size: 30px;"></i>
      </a>
    
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/orders.js"></script>

  </body>
</html>
